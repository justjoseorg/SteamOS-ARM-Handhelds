name: Sync upstream

# Keeps the default branch current with hashtagbasit/Zaviya. Fork
# changes live in fork/ (and any commits of yours), so merges are normally clean.
# If a merge conflicts, the job reports the files instead of pushing.
#
# Pushing upstream changes to .github/workflows needs a token with the
# `workflow` scope: add it as the SYNC_TOKEN secret (a classic PAT with
# repo + workflow). Without it, preserve this fork's managed workflows.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hashtagbasit/Zaviya.git
          git fetch -q upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then echo "up to date"; exit 0; fi
          git merge --no-commit --no-ff upstream/main || true
          if [ -z "$SYNC_TOKEN" ]; then
            git restore --source=HEAD --staged --worktree .github/workflows
            echo "Preserved fork-managed workflows (no SYNC_TOKEN)." >> "$GITHUB_STEP_SUMMARY"
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            printf '## Upstream sync conflicts\n\n```\n%s\n```\n' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "::error::Resolve the upstream conflicts listed in the job summary."
            exit 1
          fi
          git rev-parse -q --verify MERGE_HEAD >/dev/null
          git commit --no-edit
          git push origin "HEAD:$DEFAULT_BRANCH"
          # GITHUB_TOKEN pushes do not trigger push workflows.
          if [ -z "$SYNC_TOKEN" ]; then
            gh workflow run fork-sau.yml --ref "$DEFAULT_BRANCH"
          fi

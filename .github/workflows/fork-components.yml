name: Fork components

# Builds the parts of the sm8550 image that come from this repo's own sources
# (kernel with the gyro patches, patched InputPlumber) and stores them as assets
# of the "fork-assets" release, keyed by a hash of their sources. Upstream's
# release images are built from older sources, so fork-sau overlays these on top.
# A component is only rebuilt when its sources changed.
on:
  workflow_call:
    outputs:
      kernel_name:
        value: ${{ jobs.plan.outputs.kernel_name }}
      ip_name:
        value: ${{ jobs.plan.outputs.ip_name }}
      va_name:
        value: ${{ jobs.plan.outputs.va_name }}
      gamescope_name:
        value: ${{ jobs.plan.outputs.gamescope_name }}
      hdr_name:
        value: ${{ jobs.plan.outputs.hdr_name }}
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - external-and-mods/kernel-sm8550/**
      - external-and-mods/kernel-common/**
      - external-and-mods/InputPlumber/**.patch
      - scripts/build-inputplumber-konkr.sh
      - external-and-mods/v4l2-vaapi/**
      - external-and-mods/gamescope/**
      - scripts/build-gamescope-component.sh
      - external-and-mods/streaming-hdr/**
      - scripts/build-streaming-hdr-component.sh
      - scripts/test-sdl-hdr.py
      - scripts/test-steam-av1.py
      - steamos-overlay/usr/lib/steamos/sm8550-streaming-client
      - steamos-overlay/usr/lib/steamos/sm8550-steam-av1
      - scripts/test-*-update.py
      - fork/hooks/**
      - .github/workflows/fork-components.yml

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kernel_name: ${{ steps.p.outputs.kernel_name }}
      ip_name: ${{ steps.p.outputs.ip_name }}
      va_name: ${{ steps.p.outputs.va_name }}
      gamescope_name: ${{ steps.p.outputs.gamescope_name }}
      hdr_name: ${{ steps.p.outputs.hdr_name }}
      kernel: ${{ steps.p.outputs.kernel }}
      ip: ${{ steps.p.outputs.ip }}
      va: ${{ steps.p.outputs.va }}
      gamescope: ${{ steps.p.outputs.gamescope }}
      hdr: ${{ steps.p.outputs.hdr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check update installation
        run: |
          python3 scripts/test-av1-update.py
          python3 scripts/test-gamescope-update.py
          python3 scripts/test-streaming-hdr-update.py
          python3 scripts/test-steam-av1.py
      - id: p
        run: |
          h() { git ls-files -z "$@" | xargs -0 sha256sum | sha256sum | cut -c1-12; }
          k=$(h external-and-mods/kernel-sm8550 external-and-mods/kernel-common)
          i=$(h external-and-mods/InputPlumber/0001-bound-ayaneo-haptics-polling.patch external-and-mods/InputPlumber/0002-ayaneo-haptics-timed-rumble-and-steam-pulses.patch external-and-mods/InputPlumber/0003-manage-ayn-odin2-imu-uhid.patch external-and-mods/InputPlumber/0004-pmic-haptics-rumble-as-flat-constant.patch scripts/build-inputplumber-konkr.sh)
          v=$(h external-and-mods/v4l2-vaapi)
          g=$(h external-and-mods/gamescope scripts/build-gamescope-component.sh)
          s=$(h external-and-mods/streaming-hdr scripts/build-streaming-hdr-component.sh scripts/test-sdl-hdr.py external-and-mods/gamescope/scripts/00-gamescope/displays/ayn.odin2.portal.lua)
          echo "kernel_name=kernel-sm8550-$k.tar.gz" >> "$GITHUB_OUTPUT"
          echo "ip_name=inputplumber-$i" >> "$GITHUB_OUTPUT"
          echo "va_name=v4l2-vaapi-arm64-$v.tar.gz" >> "$GITHUB_OUTPUT"
          echo "gamescope_name=gamescope-arm64-$g.tar.gz" >> "$GITHUB_OUTPUT"
          echo "hdr_name=streaming-hdr-x86_64-$s.tar.gz" >> "$GITHUB_OUTPUT"
          have=$(gh release view fork-assets -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          grep -qx "kernel-sm8550-$k.tar.gz" <<<"$have" && echo "kernel=false" >> "$GITHUB_OUTPUT" || echo "kernel=true" >> "$GITHUB_OUTPUT"
          grep -qx "inputplumber-$i" <<<"$have" && echo "ip=false" >> "$GITHUB_OUTPUT" || echo "ip=true" >> "$GITHUB_OUTPUT"
          grep -qx "v4l2-vaapi-arm64-$v.tar.gz" <<<"$have" && echo "va=false" >> "$GITHUB_OUTPUT" || echo "va=true" >> "$GITHUB_OUTPUT"
          grep -qx "gamescope-arm64-$g.tar.gz" <<<"$have" && echo "gamescope=false" >> "$GITHUB_OUTPUT" || echo "gamescope=true" >> "$GITHUB_OUTPUT"
          grep -qx "streaming-hdr-x86_64-$s.tar.gz" <<<"$have" && echo "hdr=false" >> "$GITHUB_OUTPUT" || echo "hdr=true" >> "$GITHUB_OUTPUT"

  kernel:
    needs: plan
    if: needs.plan.outputs.kernel == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:43
    env:
      WORK: ${{ github.workspace }}/kernel-work
      ROCKNIX_DIR: ${{ github.workspace }}/rocknix
      SM8550_RECIPE: '7.2'
      FRAME_FW_DIR: ${{ github.workspace }}/fw/frm
    steps:
      - name: Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make bc bison flex python3 curl tar xz gzip cpio kmod patch perl rsync \
            openssl-devel elfutils-libelf-devel busybox file diffutils git findutils dwarves zstd which hostname gh
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wi-Fi firmware that is built into the kernel
        run: |
          mkdir fw
          gh release download fork-assets -R "$GITHUB_REPOSITORY" -p wcn7850-frame-fw.tar.gz -O - | tar -xz -C fw
      - name: ROCKNIX checkout
        run: |
          ref=$(sed -n 's/^  ROCKNIX_REF=//p' external-and-mods/kernel-sm8550/soc.env | head -1)
          git clone --depth 1 --branch "$ref" --sparse https://github.com/ROCKNIX/distribution.git "$ROCKNIX_DIR"
          git -C "$ROCKNIX_DIR" sparse-checkout set projects/ROCKNIX/packages/linux projects/ROCKNIX/devices/SM8550 packages/linux
      - name: Build
        run: bash external-and-mods/kernel-sm8550/build.sh
      - name: Package
        run: |
          out=$(readlink -f "$WORK/output/current"); krel=$(basename "$out")
          echo "built $krel"
          tar -czf kernel.tar.gz -C "$out" boot/KERNEL "modules/$krel" "config-$krel" 2>/dev/null || tar -czf kernel.tar.gz -C "$out" boot/KERNEL "modules/$krel"
          ls -l kernel.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.tar.gz

  inputplumber:
    needs: plan
    if: needs.plan.outputs.ip == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libiio-dev libudev-dev libevdev-dev clang libclang-dev pkg-config cmake
          rustup toolchain install 1.93.1 --profile minimal
      - name: Build
        run: INPUTPLUMBER_BUILD_SRC="$RUNNER_TEMP/ip" bash scripts/build-inputplumber-konkr.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inputplumber
          path: external-and-mods/InputPlumber/inputplumber-0.81.0-konkr

  vaapi:
    needs: plan
    if: needs.plan.outputs.va == 'true'
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
    steps:
      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq gcc libva-dev patchelf git python3
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build
        run: INSIDE=1 OUT="$GITHUB_WORKSPACE/out" bash external-and-mods/v4l2-vaapi/build.sh
      - name: Check decoder and surface formats
        shell: bash
        run: |
          gcc -g -O1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            external-and-mods/v4l2-vaapi/tests/av1.c -o /tmp/test-av1
          /tmp/test-av1
          gcc -g -O1 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined \
            external-and-mods/v4l2-vaapi/tests/formats.c \
            external-and-mods/v4l2-vaapi/src/{av1,dec,h264}.c -lpthread -o /tmp/test-formats
          /tmp/test-formats
          gcc -g -O1 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined \
            external-and-mods/v4l2-vaapi/tests/gbm.c -ldl -lpthread -o /tmp/test-gbm
          /tmp/test-gbm
      - name: Package
        run: |
          readelf -h out/msm_drv_video.so | grep -q 'Machine:.*AArch64'
          readelf -h out/libgbm.so.1 | grep -q 'Machine:.*AArch64'
          tar -czf vaapi.tar.gz -C out msm_drv_video.so libgbm.so.1
      - uses: actions/upload-artifact@v4
        with:
          name: vaapi
          path: vaapi.tar.gz

  gamescope:
    needs: plan
    if: needs.plan.outputs.gamescope == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-14 g++-14 meson ninja-build pkg-config git rsync cmake \
            python3-jinja2 python3-pyparsing glslang-tools luajit catch2 xwayland \
            libx11-dev libxdamage-dev libxcomposite-dev libxcursor-dev libxrender-dev \
            libxext-dev libxfixes-dev libxxf86vm-dev libxtst-dev libxres-dev libxmu-dev libxi-dev libx11-xcb-dev libglm-dev \
            libxcb-composite0-dev libxcb-icccm4-dev libxcb-render-util0-dev libxcb-res0-dev \
            libxcb-ewmh-dev libxcb-xinput-dev libxcb-xfixes0-dev \
            libwayland-dev wayland-protocols libvulkan-dev libdrm-dev libxkbcommon-dev \
            libcap-dev libsdl2-dev libavif-dev libpixman-1-dev libudev-dev libdecor-0-dev \
            libluajit-5.1-dev libinput-dev libpipewire-0.3-dev libeis-dev libseat-dev \
            libdisplay-info-dev libffi-dev libexpat1-dev libxml2-dev hwdata
      - name: Build and check
        run: CC=gcc-14 CXX=g++-14 OUT="$GITHUB_WORKSPACE/out" bash scripts/build-gamescope-component.sh
      - name: Package
        run: |
          readelf -h out/gamescope | grep -q 'Machine:.*AArch64'
          readelf -h out/libVkLayer_FROG_gamescope_wsi_aarch64.so | grep -q 'Machine:.*AArch64'
          tar -czf gamescope.tar.gz -C out gamescope scripts \
            libVkLayer_FROG_gamescope_wsi_aarch64.so VkLayer_FROG_gamescope_wsi.aarch64.json
      - uses: actions/upload-artifact@v4
        with:
          name: gamescope
          path: gamescope.tar.gz

  streaming-hdr:
    needs: plan
    if: needs.plan.outputs.hdr == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl patch \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libudev-dev libdbus-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - name: Build and check
        run: OUT="$GITHUB_WORKSPACE/out" bash scripts/build-streaming-hdr-component.sh
      - name: Package
        run: tar -czf streaming-hdr.tar.gz -C out libSDL3.so.0 manifest.json LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: streaming-hdr
          path: streaming-hdr.tar.gz

  publish:
    needs: [plan, kernel, inputplumber, vaapi, gamescope, streaming-hdr]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: art
      - run: |
          [ ! -f art/kernel/kernel.tar.gz ] || { mv art/kernel/kernel.tar.gz "art/kernel/${{ needs.plan.outputs.kernel_name }}"; gh release upload fork-assets "art/kernel/${{ needs.plan.outputs.kernel_name }}" -R "$GITHUB_REPOSITORY" --clobber; }
          [ ! -f art/inputplumber/inputplumber-0.81.0-konkr ] || { mv art/inputplumber/inputplumber-0.81.0-konkr "art/inputplumber/${{ needs.plan.outputs.ip_name }}"; gh release upload fork-assets "art/inputplumber/${{ needs.plan.outputs.ip_name }}" -R "$GITHUB_REPOSITORY" --clobber; }
          [ ! -f art/vaapi/vaapi.tar.gz ] || { mv art/vaapi/vaapi.tar.gz "art/vaapi/${{ needs.plan.outputs.va_name }}"; gh release upload fork-assets "art/vaapi/${{ needs.plan.outputs.va_name }}" -R "$GITHUB_REPOSITORY" --clobber; }
          [ ! -f art/gamescope/gamescope.tar.gz ] || { mv art/gamescope/gamescope.tar.gz "art/gamescope/${{ needs.plan.outputs.gamescope_name }}"; gh release upload fork-assets "art/gamescope/${{ needs.plan.outputs.gamescope_name }}" -R "$GITHUB_REPOSITORY" --clobber; }
          [ ! -f art/streaming-hdr/streaming-hdr.tar.gz ] || { mv art/streaming-hdr/streaming-hdr.tar.gz "art/streaming-hdr/${{ needs.plan.outputs.hdr_name }}"; gh release upload fork-assets "art/streaming-hdr/${{ needs.plan.outputs.hdr_name }}" -R "$GITHUB_REPOSITORY" --clobber; }
